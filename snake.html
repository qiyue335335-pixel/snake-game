
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON SNAKE ARCADE</title>
<style>
*{box-sizing:border-box}
:root{--green:#39ffb6;--blue:#45caff;--bg:#080d1c}
body{
 margin:0;padding:16px 10px 30px;min-height:100vh;
 background:radial-gradient(ellipse at top,#19264a,#080d1c 65%);
 color:#eaf5ff;font-family:Arial,"Microsoft YaHei",sans-serif;
 display:flex;justify-content:center;touch-action:pan-y
}
.app{width:min(100%,500px);text-align:center}
h1{margin:4px 0;color:var(--green);font-size:clamp(25px,7vw,38px);
 text-shadow:0 0 18px #39ffb688;letter-spacing:2px}
.sub{color:#8194bd;font-size:11px;letter-spacing:3px;margin-bottom:18px}
.panel{background:#111b34;border:1px solid #34476d;border-radius:14px;padding:13px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0b142a;border-radius:10px;padding:9px 3px}
.stat small{display:block;color:#8295ba;font-size:11px}
.stat b{display:block;color:var(--green);font-size:22px;margin-top:5px}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#090f20;border-radius:12px;touch-action:none}
.board{padding:4px;border-radius:16px;background:linear-gradient(135deg,#39ffb6,#426bff,#b16cff);box-shadow:0 0 28px #39ffb622;position:relative}
.overlay{position:absolute;inset:4px;border-radius:12px;background:#060b19eF;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.overlay.hide{display:none}
.menu{width:100%;max-width:340px;background:#111b34;border:1px solid #405580;border-radius:16px;padding:18px}
h2{color:var(--green);margin:0 0 8px;font-size:25px}
p{font-size:13px;color:#a2b3d1;line-height:1.6}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.btn{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;background:linear-gradient(100deg,#39ffb6,#45caff);color:#061522;font-weight:bold}
.btn2{width:100%;border:1px solid #405580;border-radius:10px;padding:10px;margin-top:8px;background:#172544;color:#e8f3ff}
input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #405580;background:#080f22;color:white;margin:6px 0}
.row{display:flex;gap:7px}
.row>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:1;min-width:70px;padding:9px 5px;background:#172544;color:#b9c9e8;border:1px solid #405580;border-radius:9px;font-size:12px}
.tabs button.active{color:var(--green);border-color:var(--green);background:#12352f}
.controls{display:flex;gap:8px;margin:10px 0}
.controls button{flex:1;background:#14213d;color:#e8f3ff;border:1px solid #34476d;border-radius:10px;padding:11px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:180px;margin:14px auto}
.dpad button{height:45px;background:#14213d;border:1px solid #34476d;border-radius:10px;color:var(--green);font-size:22px}
.dpad .blank{visibility:hidden}
.list{max-height:190px;overflow:auto;text-align:left}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px;border-bottom:1px solid #293957;font-size:13px}
.item span:last-child{color:var(--green);font-weight:bold}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.skin{border:1px solid #34476d;background:#0b142a;border-radius:12px;padding:10px;color:#dbe8ff}
.skin.selected{border-color:var(--green);box-shadow:0 0 12px #39ffb633}
.swatch{height:28px;border-radius:8px;margin-bottom:7px}
.note{font-size:11px;color:#8294b7;line-height:1.7}
.hidden{display:none!important}
@media(min-width:700px){.dpad{display:none}}
</style>
</head>
<body>
<div class="app">
<h1>⚡ NEON SNAKE</h1>
<div class="sub">ARCADE EDITION · 街机进化版</div>

<div class="stats">
 <div class="stat"><small>本局分数</small><b id="score">0</b></div>
 <div class="stat"><small>最高分</small><b id="best">0</b></div>
 <div class="stat"><small>金币</small><b id="coins">0</b></div>
</div>

<div class="panel">
 <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
  <span id="playerLabel">玩家：游客</span>
  <span id="levelLabel" style="color:#39ffb6">简单</span>
 </div>
</div>

<div class="board">
 <canvas id="game" width="400" height="400"></canvas>

 <div class="overlay" id="home">
  <div class="menu">
   <h2>街机大厅</h2>
   <p>输入昵称，开始你的霓虹挑战！</p>
   <input id="nickname" maxlength="16" placeholder="输入你的游戏昵称">
   <div class="tabs" id="difficulty">
    <button data-level="easy" class="active">简单</button>
    <button data-level="normal">普通</button>
    <button data-level="hard">困难</button>
   </div>
   <button class="btn" id="play">开始游戏</button>
   <button class="btn2" id="showRank">🏆 排行榜</button>
   <button class="btn2" id="showShop">🛒 蛇皮肤商店</button>
   <p class="note">选择难度后开始游戏。吃食物可得分和金币。</p>
  </div>
 </div>

 <div class="overlay hide" id="pause">
  <div class="menu">
   <h2>游戏暂停</h2>
   <p>休息一下，准备好后继续。</p>
   <button class="btn" id="resume">继续游戏</button>
   <button class="btn2" id="pauseRestart">重新开始</button>
   <button class="btn2" id="pauseHome">返回大厅</button>
  </div>
 </div>

 <div class="overlay hide" id="over">
  <div class="menu">
   <h2 id="overTitle">游戏结束</h2>
   <p id="overMsg">本局挑战结束</p>
   <div style="font-size:42px;color:#39ffb6;font-weight:bold" id="finalScore">0</div>
   <p id="earned">获得金币：0</p>
   <button class="btn" id="again">再玩一次</button>
   <button class="btn2" id="overHome">返回大厅</button>
   <button class="btn2" id="overRank">查看排行榜</button>
  </div>
 </div>
</div>

<div class="controls">
 <button id="pauseBtn">Ⅱ 暂停</button>
 <button id="restartBtn">↻ 重开</button>
</div>

<div class="dpad">
 <button class="blank"></button><button data-dir="up">▲</button><button class="blank"></button>
 <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>

<div class="panel">
 <div class="tabs">
  <button id="rankTab">🏆 排行榜</button>
  <button id="shopTab">🎨 皮肤商店</button>
  <button id="resetTab">重置本地数据</button>
 </div>
 <div id="rankPanel" class="hidden">
  <h3>🏆 本机前 10 名</h3>
  <div class="list" id="rankList"></div>
  <p class="note">仅统计此浏览器保存的成绩，不是联网排行榜。</p>
 </div>
 <div id="shopPanel" class="hidden">
  <h3>🎨 蛇皮肤</h3>
  <p>选择已解锁的颜色，或使用金币解锁新皮肤。</p>
  <div id="skinGrid" class="skin-grid"></div>
  <p class="note">皮肤只改变外观，不影响游戏速度或碰撞规则。</p>
 </div>
</div>

<div class="note">电脑：方向键 / WASD · 空格暂停<br>手机：滑动游戏区域或使用方向按钮</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const N=20,CELL=20;
const levels={
 easy:{name:"简单",start:190,min:85,step:5},
 normal:{name:"普通",start:145,min:55,step:7},
 hard:{name:"困难",start:105,min:38,step:8}
};
const skins=[
 {id:"green",name:"霓虹绿",color:"#39ffb6",price:0},
 {id:"blue",name:"电光蓝",color:"#45caff",price:50},
 {id:"purple",name:"幻影紫",color:"#b16cff",price:100},
 {id:"gold",name:"黄金蛇",color:"#ffd166",price:200},
 {id:"pink",name:"极光粉",color:"#ff5dc8",price:300},
 {id:"ice",name:"冰晶白",color:"#d9f7ff",price:500}
];

let data=loadData();
let player="";
let level="easy";
let snake=[],food={x:15,y:10};
let dir={x:1,y:0},nextDir={x:1,y:0};
let score=0,earned=0,tick=190,timer=null,state="home";
let particles=[],touchStart=null;

function loadData(){
 try{
  const d=JSON.parse(localStorage.getItem("neonSnakeArcade")||"{}");
  return {
   best:Number(d.best)||0,
   coins:Number(d.coins)||0,
   ranks:Array.isArray(d.ranks)?d.ranks:[],
   unlocked:Array.isArray(d.unlocked)?d.unlocked:["green"],
   skin:typeof d.skin==="string"?d.skin:"green"
  };
 }catch(e){
  return {best:0,coins:0,ranks:[],unlocked:["green"],skin:"green"};
 }
}
function saveData(){
 try{localStorage.setItem("neonSnakeArcade",JSON.stringify(data));}
 catch(e){alert("浏览器暂时无法保存数据，请检查隐私设置。");}
}
function getSkin(){return skins.find(s=>s.id===data.skin)||skins[0];}
function showScreen(which){
 ["home","pause","over"].forEach(id=>$(id).classList.toggle("hide",id!==which));
}
function updateStats(){
 $("score").textContent=score;
 $("best").textContent=data.best;
 $("coins").textContent=data.coins;
 $("playerLabel").textContent="玩家："+(player||"游客");
 $("levelLabel").textContent=levels[level].name+" · "+(levels[level].start/tick).toFixed(1)+"x";
}
function resetSnake(){
 snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];
 dir={x:1,y:0};nextDir={x:1,y:0};
}
function randomFood(){
 do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
 while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function startGame(){
 clearInterval(timer);
 player=$("nickname").value.trim().slice(0,16)||player||"玩家";
 $("nickname").value=player;
 score=0;earned=0;tick=levels[level].start;
 resetSnake();randomFood();particles=[];
 state="playing";showScreen(null);updateStats();draw();
 timer=setInterval(update,tick);
}
function setLevel(l){
 if(!levels[l])return;
 level=l;
 document.querySelectorAll("[data-level]").forEach(b=>b.classList.toggle("active",b.dataset.level===l));
 $("levelLabel").textContent=levels[l].name;
}
function resetTimer(){
 clearInterval(timer);
 timer=setInterval(update,tick);
}
function pauseGame(){
 if(state!=="playing")return;
 state="paused";clearInterval(timer);showScreen("pause");
}
function resumeGame(){
 if(state!=="paused")return;
 state="playing";showScreen(null);resetTimer();
}
function home(){
 clearInterval(timer);state="home";showScreen("home");draw();
}
function finish(won=false){
 clearInterval(timer);state="over";
 let bonus=Math.floor(score/10);
 earned=bonus;
 data.coins+=bonus;
 if(score>data.best)data.best=score;
 if(score>0){
  data.ranks.push({name:player||"玩家",score,level:levels[level].name,date:new Date().toLocaleDateString()});
  data.ranks.sort((a,b)=>b.score-a.score);
  data.ranks=data.ranks.slice(0,10);
 }
 saveData();updateStats();
 $("overTitle").textContent=won?"挑战成功！":"游戏结束";
 $("overMsg").textContent=player+"，本局挑战结束！";
 $("finalScore").textContent=score;
 $("earned").textContent="获得金币："+bonus;
 showScreen("over");draw();
}
function setDir(x,y){
 if(state==="home"){startGame();}
 if(state!=="playing")return;
 if(x===-dir.x&&y===-dir.y)return;
 nextDir={x,y};
}
function update(){
 if(state!=="playing")return;
 dir={...nextDir};
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 const eating=head.x===food.x&&head.y===food.y;
 const body=eating?snake:snake.slice(0,-1);
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){
  finish();return;
 }
 snake.unshift(head);
 if(eating){
  score+=10;
  tick=Math.max(levels[level].min,tick-levels[level].step);
  randomFood();
  for(let i=0;i<12;i++){
   let a=Math.random()*Math.PI*2;
   particles.push({x:food.x*CELL+10,y:food.y*CELL+10,vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:1});
  }
  if(snake.length>=N*N){finish(true);return;}
  resetTimer();
 }else snake.pop();
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.06;});
 particles=particles.filter(p=>p.life>0);
 updateStats();draw();
}
function draw(){
 const g=ctx.createLinearGradient(0,0,400,400);
 g.addColorStop(0,"#0b1830");g.addColorStop(1,"#100d2b");
 ctx.fillStyle=g;ctx.fillRect(0,0,400,400);
 ctx.strokeStyle="rgba(90,150,220,.10)";
 for(let i=0;i<=N;i++){
  ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,400);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(400,i*CELL);ctx.stroke();
 }
 // 食物
 let fx=food.x*CELL+10,fy=food.y*CELL+10;
 ctx.save();ctx.shadowColor="#ff4e89";ctx.shadowBlur=20;
 ctx.fillStyle="#ff4e89";ctx.beginPath();
 ctx.arc(fx,fy,6+Math.sin(Date.now()/150)*1.5,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // 蛇
 const color=getSkin().color;
 snake.forEach((s,i)=>{
  let x=s.x*CELL+3,y=s.y*CELL+3,w=14;
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=i===0?22:10;
  ctx.fillStyle=i===0?"#ffffff":color;
  ctx.globalAlpha=i===0?1:Math.max(.5,1-i/(snake.length*1.7));
  ctx.beginPath();ctx.roundRect(x,y,w,w,5);ctx.fill();
  if(i===0){
   ctx.shadowBlur=0;ctx.fillStyle="#061322";
   let eyes;
   if(dir.x===1)eyes=[[x+10,y+4],[x+10,y+10]];
   else if(dir.x===-1)eyes=[[x+4,y+4],[x+4,y+10]];
   else if(dir.y===-1)eyes=[[x+4,y+4],[x+10,y+4]];
   else eyes=[[x+4,y+10],[x+10,y+10]];
   eyes.forEach(e=>{ctx.beginPath();ctx.arc(e[0],e[1],1.5,0,Math.PI*2);ctx.fill();});
  }
  ctx.restore();
 });
 particles.forEach(p=>{
  ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle="#45caff";
  ctx.shadowColor="#45caff";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
 });
}
function showRanks(){
  showScreen(null);
  $("rankPanel").classList.remove("hidden");
  $("shopPanel").classList.add("hidden");
  renderRanks();
  $("rankPanel").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function renderRanks(){
}
function renderRanks(){
 const box=$("rankList");box.innerHTML="";
 if(!data.ranks.length){box.innerHTML='<p class="note">还没有成绩，开始游戏来登上排行榜吧！</p>';return;}
 data.ranks.slice(0,10).forEach((r,i)=>{
  const div=document.createElement("div");div.className="item";
  const left=document.createElement("span");
  left.textContent=(i+1)+". "+r.name+" · "+r.level;
  const right=document.createElement("span");right.textContent=r.score+" 分";
  div.append(left,right);box.appendChild(div);
 });
}
function showShop(){
 $("shopPanel").classList.remove("hidden");
 $("rankPanel").classList.add("hidden");
 renderShop();
}
function renderShop(){
 const box=$("skinGrid");box.innerHTML="";
 skins.forEach(s=>{
  const owned=data.unlocked.includes(s.id);
  const selected=data.skin===s.id;
  const b=document.createElement("button");
  b.className="skin"+(selected?" selected":"");
  const sw=document.createElement("div");sw.className="swatch";sw.style.background=s.color;
  sw.style.boxShadow="0 0 14px "+s.color;
  const name=document.createElement("div");name.textContent=s.name;
  const info=document.createElement("div");info.style.fontSize="12px";info.style.marginTop="6px";
  info.textContent=selected?"已装备":owned?"点击装备":s.price+" 金币";
  b.append(sw,name,info);
  b.onclick=()=>{
   if(owned){data.skin=s.id;saveData();renderShop();draw();return;}
   if(data.coins<s.price){alert("金币不足！继续玩游戏赚取金币吧。");return;}
   if(confirm("花费 "+s.price+" 金币解锁 "+s.name+" 吗？")){
    data.coins-=s.price;data.unlocked.push(s.id);data.skin=s.id;
    saveData();updateStats();renderShop();draw();
   }
  };
  box.appendChild(b);
 });
}
$("play").onclick=startGame;
$("resume").onclick=resumeGame;
$("again").onclick=startGame;
$("pauseRestart").onclick=startGame;
$("pauseHome").onclick=home;
$("overHome").onclick=home;
$("overRank").onclick=showRanks;
$("showRank").onclick=showRanks;
$("showShop").onclick=showShop;
$("rankTab").onclick=showRanks;
$("shopTab").onclick=showShop;
$("pauseBtn").onclick=()=>state==="playing"?pauseGame():state==="paused"?resumeGame():startGame();
$("restartBtn").onclick=startGame;
document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>setLevel(b.dataset.level));
document.querySelectorAll("[data-dir]").forEach(b=>{
 const map={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
 b.addEventListener("pointerdown",e=>{e.preventDefault();setDir(...map[b.dataset.dir]);});
});
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
 if(map[k]){e.preventDefault();setDir(...map[k]);}
 if(k===" "||k==="escape"){e.preventDefault();state==="playing"?pauseGame():state==="paused"?resumeGame():null;}
 if(k==="enter"&&(state==="home"||state==="over"))startGame();
});
canvas.addEventListener("touchstart",e=>{
 const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY};
},{passive:true});
canvas.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
 touchStart=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
 Math.abs(dx)>Math.abs(dy)?setDir(dx>0?1:-1,0):setDir(0,dy>0?1:-1);
},{passive:true});

$("resetTab").onclick=()=>{
 if(!confirm("确定清除本机保存的金币、最高分、排行榜和皮肤吗？此操作无法撤销。"))return;
 data={best:0,coins:0,ranks:[],unlocked:["green"],skin:"green"};
 saveData();updateStats();renderRanks();renderShop();draw();
};

updateStats();setLevel("easy");resetSnake();randomFood();draw();
</script>
</body>
</html>
